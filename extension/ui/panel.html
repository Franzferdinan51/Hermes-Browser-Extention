<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hermes Agent Panel</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="ph">
    <div class="ph-logo"><img src="../icons/icon32.png" alt="" /></div>
    <div class="ph-title"><strong>Hermes</strong><span>browser companion</span></div>
    <button id="btnSettings" class="icon-btn" title="Open Hermes settings" aria-label="Open Hermes settings">⚙</button>
    <div class="ph-status" id="phStatus" title="connection">●</div>
  </header>

  <section class="pagebar" id="pagebar">
    <div class="page-title" id="pageTitle">No page snapshot yet</div>
    <button id="btnSnapshot" class="mini">snapshot</button>
  </section>

  <main class="chat" id="chat">
    <div class="empty" id="empty">Ask Hermes about the page you're viewing. It can read the DOM and, when enabled, act on it.</div>
  </main>

  <footer class="composer">
    <div class="toolbar">
      <button id="btnClear" title="New conversation">New</button>
      <label class="model-picker" title="Choose the model Hermes uses">
        <span>MODEL</span>
        <select id="modelSelect" aria-label="Hermes model"><option>Loading models…</option></select>
      </label>
      <button id="refreshModels" class="icon-btn" title="Refresh model list">↻</button>
    </div>
    <div class="model-filter-row">
      <input type="search" id="modelFilter" placeholder="Filter models or providers…" autocomplete="off" />
      <span id="modelCount" class="muted"></span>
    </div>
    <div class="composer-row">
      <textarea id="prompt" rows="1" placeholder="Message Hermes…"></textarea>
      <button id="send" class="primary">Send</button>
    </div>
    <div class="attachbar">
      <label class="check" title="Include a fresh page snapshot in this message">
        <input type="checkbox" id="autoSnap" checked /> attach page
      </label>
      <span class="spacer"></span>
      <span class="muted" id="runInfo"></span>
    </div>
  </footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
